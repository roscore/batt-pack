[package]
name = "bp_web"
description = "Static web UI for the batt-pack planner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
bp_core = { path = "../bp_core" }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "Navigator", "Event", "EventTarget",
  "NodeList", "Node", "Storage", "CssStyleDeclaration",
]
